<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hancock County Young Birders Club | YBC</title>
    <meta name="description" content="Discover the Hancock County Young Birders Club (YBC), exploring nature and protecting birds in Maine." />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  </head>
  <body>
    <header>
      <div class="top-bar">
        <div class="container">
          <a href="#" class="logo">Hancock County Young Birders <span>Club</span></a>
        </div>
      </div>
      <a href="https://app.99pledges.com/fund/birdathon2026/ybc" class="donate-bar" target="_blank">
        Click here to donate
      </a>
    </header>

    <main>
      <!-- Affiliation Section -->
      <section id="affiliation">
        <div class="container">
          <p class="affiliation-text">
            We are a project of the 
            <a href="http://www.downeastaudubon.org/" target="_blank" rel="noopener">Downeast Chapter of Maine Audubon</a>
          </p>
        </div>
      </section>

      <!-- Instagram Section -->
      <section id="instagram">
        <div class="container">
          <div class="section-header">
            <h2>Follow us on Instagram!</h2>
          </div>
          <div class="insta-container">
            <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/hc_youngbirdersclub/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style=" background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px auto; max-width:540px; min-width:326px; padding:0; width:99.375%; width:-webkit-calc(100% - 2px); width:calc(100% - 2px);">
              <div style="padding:16px;">
                <a href="https://www.instagram.com/hc_youngbirdersclub/?utm_source=ig_embed&amp;utm_campaign=loading" style=" background:#FFFFFF; line-height:0; padding:0 0; text-align:center; text-decoration:none; width:100%;" target="_blank">
                  <div style=" display: flex; flex-direction: row; align-items: center;">
                    <div style="background-color: #F4F4F4; border-radius: 50%; height: 40px; margin-right: 14px; width: 40px;"></div>
                    <div style="display: flex; flex-direction: column; flex-grow: 1; justify-content: center;">
                      <div style=" background-color: #F4F4F4; border-radius: 4px; flex-grow: 0; height: 14px; margin-bottom: 6px; width: 100px;"></div>
                      <div style=" background-color: #F4F4F4; border-radius: 4px; flex-grow: 0; height: 14px; width: 60px;"></div>
                    </div>
                  </div>
                </a>
              </div>
            </blockquote>
            <script async src="//www.instagram.com/embed.js"></script>
          </div>
        </div>
      </section>

      <!-- Timeline Section -->
      <section id="reports" class="section">
        <div class="container">
          <div class="section-header">
            <h2>eBird Trip Reports</h2>
          </div>
          
          <div class="timeline-viewer">
            <button class="nav-btn prev" id="scroll-prev" aria-label="Scroll left">&#10094;</button>
            <div id="timeline" class="timeline-scroll-container">
              <!-- Timeline nodes will be injected here -->
            </div>
            <button class="nav-btn next" id="scroll-next" aria-label="Scroll right">&#10095;</button>
          </div>
        </div>
      </section>
    </main>

    <a href="https://forms.gle/kpizSSjbhjwtRof4A" class="join-btn" target="_blank">Join Now</a>

    <script type="module" src="/main.js"></script>
  </body>
</html>
