# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # Refresh eBird stats every Monday. Times are UTC, so these land at 6:23 AM and
  # 2:23 PM Eastern during daylight time, an hour earlier once EST starts.
  # Deliberately off the top of the hour: GitHub queues every ":00" job in the world
  # at once and silently drops schedules it can't get to. The afternoon run is a
  # backstop in case the morning one is dropped; a second deploy costs nothing.
  schedule:
    - cron: "23 10 * * 1"
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pulls club-wide numbers from every eBird trip report in the outings sheet.
      # If eBird is unreachable, the committed public/stats.json is used as a fallback.
      - name: Refresh eBird stats
        continue-on-error: true
        run: python3 scrape_ebird.py
      # Snapshots the outings sheet so pages render instantly; the site refreshes
      # attendance from Apps Script in the background. Falls back to the committed copy.
      - name: Snapshot outings
        continue-on-error: true
        run: python3 fetch_outings.py
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
